[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-lead-enrichment"
version = "0.1.0"
description = "Resilient browser-based company intelligence extraction agent"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.46.0"]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]

[project.scripts]
lead-enrich = "lead_enrichment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
lint.ignore = ["FA100", "UP006", "UP035", "UP045"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]